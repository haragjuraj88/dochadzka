<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dochádzka</title>
    <!-- Nastavenia pre iPhone, aby sa web správal ako aplikácia -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Dochádzka">
    
    <style>
        :root {
            --bg-color: #f2f2f7;
            --card-bg: #ffffff;
            --text-color: #000000;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #1c1c1e;
                --card-bg: #2c2c2e;
                --text-color: #ffffff;
            }
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
        }
        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        h1 { text-align: center; margin-top: 10px; font-weight: 700; }
        .buttons-row { display: flex; gap: 15px; }
        .btn {
            flex: 1;
            border: none;
            border-radius: 14px;
            padding: 16px;
            font-size: 18px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn:active { opacity: 0.7; }
        .btn-green { background-color: #34c759; }
        .btn-red { background-color: #ff3b30; }
        .btn-blue { background-color: #007aff; width: 100%; }
        
        .summary-card {
            background-color: var(--card-bg);
            border-radius: 14px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .summary-title { font-size: 12px; color: #8e8e93; font-weight: bold; letter-spacing: 0.5px; }
        .summary-value { font-size: 32px; font-weight: 800; color: #007aff; margin-top: 5px; }
        
        .history-section {
            background-color: var(--card-bg);
            border-radius: 14px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            flex-grow: 1;
            max-height: 300px;
            overflow-y: auto;
        }
        .history-title { font-size: 16px; font-weight: bold; margin-bottom: 10px; }
        .record-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #e5e5ea;
        }
        .record-item:last-child { border-bottom: none; }
        .type-badge { font-weight: bold; width: 70px; }
        .type-prichod { color: #34c759; }
        .type-odchod { color: #ff3b30; }
        .record-date { color: #8e8e93; font-size: 14px; }
        .record-right { text-align: right; }
        .record-time { font-family: monospace; font-size: 15px; }
        .record-duration { font-size: 12px; color: #007aff; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>Dochádzka</h1>
    
    <!-- Tlačidlá -->
    <div class="buttons-row">
        <button class="btn btn-green" onclick="logAttendance('Príchod')">Príchod</button>
        <button class="btn btn-red" onclick="logAttendance('Odchod')">Odchod</button>
    </div>
    
    <!-- Sumár mesiaca -->
    <div class="summary-card">
        <div class="summary-title">ODPRACOVANÉ TENTO MESIAC</div>
        <div id="totalHours" class="summary-value">0h 0m</div>
    </div>
    
    <!-- História -->
    <div class="history-section">
        <div class="history-title">História záznamov</div>
        <div id="historyList"></div>
    </div>
    
    <!-- Export -->
    <button class="btn btn-blue" onclick="exportCSV()">Exportovať report (CSV)</button>
</div>

<script>
    let records = JSON.parse(localStorage.getItem('attendance_records')) || [];

    function logAttendance(type) {
        const now = new Date();
        
        const dateString = now.toLocaleDateString('sk-SK').replace(/\s/g, '');
        const timeString = now.toTimeString().split(' ')[0];
        
        let durationMinutes = null;
        
        if (type === 'Odchod') {
            // Hľadanie posledného príchodu bez spárovaného odchodu
            let lastArrivalIndex = -1;
            for (let i = records.length - 1; i >= 0; i--) {
                if (records[i].type === 'Príchod') {
                    lastArrivalIndex = i;
                    break;
                }
            }
            
            if (lastArrivalIndex !== -1) {
                const arrival = records[lastArrivalIndex];
                // Rozoberieme slovenský formát dátumu "DD.MM.YYYY" a času "HH:MM:SS"
                const dParts = arrival.date.split('.');
                const tParts = arrival.time.split(':');
                const arrivalDate = new Date(dParts[2], dParts[1] - 1, dParts[0], tParts[0], tParts[1], tParts[2]);
                
                const diffMs = now - arrivalDate;
                durationMinutes = Math.floor(diffMs / 1000 / 60);
            }
        }
        
        const newRecord = {
            id: Date.now(),
            date: dateString,
            time: timeString,
            type: type,
            durationMinutes: durationMinutes
        };
        
        records.push(newRecord);
        localStorage.setItem('attendance_records', JSON.stringify(records));
        
        updateUI();
        
        if (durationMinutes !== null) {
            alert(`Odchod zaznamenaný. Odpracované: ${Math.floor(durationMinutes / 60)}h ${durationMinutes % 60}m.`);
        } else {
            alert(`${type} zaznamenaný o ${timeString}`);
        }
    }

    function updateUI() {
        const historyList = document.getElementById('historyList');
        historyList.innerHTML = '';
        
        let totalMin = 0;
        
        // Zobrazujeme od najnovšieho po najstarší
        [...records].reverse().forEach(record => {
            if (record.durationMinutes) totalMin += record.durationMinutes;
            
            const item = document.createElement('div');
            item.className = 'record-item';
            
            let durationText = record.durationMinutes !== null ? `Trvanie: ${Math.floor(record.durationMinutes / 60)}h ${record.durationMinutes % 60}m` : '';
            let badgeClass = record.type === 'Príchod' ? 'type-prichod' : 'type-odchod';
            
            item.innerHTML = `
                <div>
                    <div class="type-badge ${badgeClass}">${record.type}</div>
                    <div class="record-date">${record.date}</div>
                </div>
                <div class="record-right">
                    <div class="record-time">${record.time}</div>
                    <div class="record-duration">${durationText}</div>
                </div>
            `;
            historyList.appendChild(item);
        });
        
        // Prepočítanie celkového sumáru
        document.getElementById('totalHours').innerText = `${Math.floor(totalMin / 60)}h ${totalMin % 60}m`;
    }

    function exportCSV() {
        if (records.length === 0) {
            alert('Žiadne dáta na export.');
            return;
        }
        
        let csvContent = "data:text/csv;charset=utf-8,Typ;Datum;Cas;Odpracovane_Hodiny\n";
        
        records.forEach(record => {
            let hoursText = record.durationMinutes !== null ? (record.durationMinutes / 60).toFixed(2) : "";
            csvContent += `${record.type};${record.date};${record.time};${hoursText}\n`;
        });
        
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", "Dochadzka_Report.csv");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    // Inicializácia pri otvorení
    updateUI();
</script>
</body>
</html>
